    listen_on: 127.0.0.2
    no_fwd: true
    load_extension:
    - module: 3rd-party/open5gs-core/build/subprojects/freeDiameter/extensions/dbg_msg_dumps.fdx
      conf: 34952
    - module: 3rd-party/open5gs-core/build/subprojects/freeDiameter/extensions/dict_rfc5777.fdx
