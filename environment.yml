# Single default build/runtime environment for Ubuntu 26.04.
# Install with: ./requirements.sh
# Configure and build with: ./build.sh
# Python tooling and the embedded interpreter both use conda Python 3.11.
# pybind11 and nlohmann/json remain vendored; do not install competing headers.
name: 5ghoul23
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - clang=23.1.6
  - clangxx=23.1.6
  - clang-tools=23.1.6
  - lld=23.1.6
  - llvm=23.1.6
  - llvm-tools=23.1.6
  - llvmdev=23.1.6
  - gcc=16.2.0
  - gxx=16.2.0
  - cmake>=3.18.4
  - ninja
  - meson
  - make
  - pkg-config
  - flex
  - bison
  - swig
  - git
  - zstd
  - graphviz
  - cxxopts
  - glib
  - freetype
  - zlib
  - libpcap
  - libconfig
  # Namespace-local subscriber database; Open5GS's C driver is built separately.
  # conda-forge libmongoc/libbson 1.23.2 conflict with current ICU/snappy pins.
  - mongodb=8.0.23
  - libboost-devel=1.90.0
  - folly=2026.10.26.00
  - fmt=12.1.0
  # Runtime and development headers are separate packages. 2.9 and 2.20.0
  # are unsolvable with these host toolchain/library pins; use the proven pair.
  - pagmo=2.19.1
  - pagmo-devel=2.19.1
  - nss=3.118
  - nspr=4.41
  - xorg-libxscrnsaver
  - rtaudio=5.2.0
  - glfw=3.4
  - double-conversion
  - zeromq
  - cppzmq
  - czmq
  - json-c
  - snappy
  - lz4-c
  - libevent
  - libunwind
  - glog
  - gflags
  - libgcrypt
  - gnutls
  - libxml2
  - libnghttp2
  - krb5
  - libnl
  - libcap
  - brotli
  - lua=5.2                 # Wireshark Lua is disabled (non-PIC static archive).
  - c-ares
  - libssh
  - libmaxminddb
  - pcre2
  - speexdsp
  - libopus
  - libtiff
  - tbb
  - sshpass
  - bc
  - curl
  - wget
  - nodejs
  # Keep Python dependencies in their existing canonical requirements file.
  - pip:
      - -r modules/requirements.txt
      - pymongo==4.20.1
# Host-only runtime tools (not conda build dependencies): psmisc, tcpdump, kmod.
